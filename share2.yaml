          - heading "峰终定律 Peak–End Rule" [level=3] [ref=e197]:
            - text: 峰终定律
            - generic [ref=e198]: Peak–End Rule
          - paragraph [ref=e199]: 对一段经历的 记忆 ，由"最强烈的瞬间"与"结尾"决定，与持续时长几乎无关。这就是"记忆自我"的工作方式。
          - generic [ref=e200]:
            - generic [ref=e201]: 例
            - text: 两次同样时长的体检：A 过程温和但结尾刺痛；B 过程难忍但结尾温柔。事后 B 的评价更高。
