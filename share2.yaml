        - text: TAKEAWAYS
      - heading "对工作与决策的八条行动启发" [level=2] [ref=e288]
      - paragraph [ref=e289]: 本书给的不是"不再犯错"的豁免权，而是对冲偏误的制度与方法。下列每条都对应到前文中的偏误，可在团队流程里直接落地。
      - generic [ref=e290]:
        - generic [ref=e291]:
          - generic [ref=e292]: "01"
          - generic [ref=e293]:
            - heading "会议前先写\"独立判断\"" [level=4] [ref=e294]
            - paragraph [ref=e295]: 任何重要讨论开始前，每位成员先独立写下自己的估计与理由，再公开。对抗锚定与从众。
        - generic [ref=e296]:
          - generic [ref=e297]: "02"
          - generic [ref=e298]:
            - heading "用评分卡替代\"整体印象\"" [level=4] [ref=e299]
            - paragraph [ref=e300]: 招聘、绩效、方案评审：把维度拆开独立打分，再加权汇总，避免系统 1 的"看个大概"。
        - generic [ref=e301]:
          - generic [ref=e302]: "03"
          - generic [ref=e303]:
            - heading "重大决策前先问\"基率\"" [level=4] [ref=e304]
            - paragraph [ref=e305]: 项目估值、新业务可行性，先看行业/同类的基率，再叠加本项目的特异性。对抗规划谬误。
        - generic [ref=e306]:
          - generic [ref=e307]: "04"
          - generic [ref=e308]:
            - heading "做一次 Premortem（预演失败）" [level=4] [ref=e309]
            - paragraph [ref=e310]: 在项目启动前，假设"半年后它彻底失败了"，写下最可能的 5 个原因。把后见之明前置为预防。
        - generic [ref=e311]:
          - generic [ref=e312]: "05"
          - generic [ref=e313]:
