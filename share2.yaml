        - text: THE TWO SYSTEMS
      - heading "双系统核心框架·快与慢" [level=2] [ref=e78]
      - paragraph [ref=e79]: 卡尼曼把心智拆成两套"装置"。它们不是解剖结构，而是一种隐喻：用来描述我们大脑中两种不同的工作方式。
      - generic [ref=e81]:
        - generic [ref=e82]:
          - generic [ref=e83]: SYSTEM 1
          - heading "系统 1 · 快" [level=3] [ref=e84]
          - generic [ref=e85]: FAST · INTUITIVE · ALWAYS ON
          - paragraph [ref=e86]: 无意识、自动、快速、低能耗、并行、联想、情绪化、不可关闭。看见2+2就报4，被人骂了立刻有情绪，听见巨响立刻警觉——都是它在工作。
          - list [ref=e87]:
            - listitem [ref=e88]:
              - generic [ref=e89]: 擅长
              - generic [ref=e90]: 模式识别、熟练技能、即时反应、把感觉当作判断
            - listitem [ref=e91]:
              - generic [ref=e92]: 缺陷
              - generic [ref=e93]: 受锚定、替代、情绪、WYSIATI 限制；"所见即全部"
            - listitem [ref=e94]:
              - generic [ref=e95]: 代价
              - generic [ref=e96]: 几乎免费地持续运行，错误却难被察觉
          - generic [ref=e97]: "\"系统1不是可以被关掉的。真正能做的，是学会识别它在哪里、在什么时候会出错的。\""
        - generic [aria-hidden] [ref=e98]: vs
        - generic [ref=e99]:
          - generic [ref=e100]: SYSTEM 2
          - heading "系统 2 · 慢" [level=3] [ref=e101]
          - generic [ref=e102]: SLOW · DELIBERATE · LAZY
          - paragraph [ref=e103]: 有意识、受控、慢速、高能耗、串行、规则化、可计算、容易"摸鱼"。17×24 这种不熟悉的乘法、做复杂的风险评估、忍住不刷手机——都要它出手。
          - list [ref=e104]:
            - listitem [ref=e105]:
              - generic [ref=e106]: 擅长
              - generic [ref=e107]: 复杂运算、比较、逻辑校验、抑制冲动、规划与校验
            - listitem [ref=e108]:
