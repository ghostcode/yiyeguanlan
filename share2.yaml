              - generic [ref=e110]: 带宽有限、自律成本高、容易默认接受系统1的建议
            - listitem [ref=e111]:
              - generic [ref=e112]: 代价
              - generic [ref=e113]: 能量稀缺，因此"懒"——这正是偏误的源头
          - generic [ref=e114]: "\"系统2并不天然理性，它只是更慢、更费力地遵循规则——而一旦疲劳，它会直接放弃思考。\""
    - generic [ref=e116]:
      - generic [ref=e117]:
        - generic [ref=e118]: 04 /
        - text: KEY BIASES
      - heading "十张书签，十个常踩的认知偏误" [level=2] [ref=e119]
      - paragraph [ref=e120]: 卡尼曼与特沃斯基用实验反复证明：人类的判断会系统性地、可预测地偏离"理性人模型"。下面这些偏误，是工作、决策与自我理解中最常出现的一组。
      - generic [ref=e121]:
        - article [ref=e122]:
          - generic [ref=e124]: N° 01
          - heading "锚定效应 Anchoring" [level=3] [ref=e125]:
            - text: 锚定效应
            - generic [ref=e126]: Anchoring
          - paragraph [ref=e127]: 做判断时， 先出现的数字 会像一个"锚"一样，把后续估计悄悄拉向它，即使它毫无信息量。
          - generic [ref=e128]:
            - generic [ref=e129]: 例
            - text: 先被问"非洲国家在联合国的占比是 65% 还是 10%"，再估计联合国成员总数，前者会把答案拉高很多。
        - article [ref=e130]:
          - generic [ref=e132]: N° 02
          - heading "可得性启发 Availability" [level=3] [ref=e133]:
            - text: 可得性启发
            - generic [ref=e134]: Availability
          - paragraph [ref=e135]: 凭 "想不想得起" 来判断事情有多频繁/多可能。容易想起 = 容易被高估；难想起 = 容易被低估。
          - generic [ref=e136]:
            - generic [ref=e137]: 例
            - text: 飞机失事新闻多 → 觉得飞行比开车危险；实际上单位里程的死亡率，开车高得多。
        - article [ref=e138]:
          - generic [ref=e140]: N° 03
          - heading "代表性启发 Representativeness" [level=3] [ref=e141]:
            - text: 代表性启发
            - generic [ref=e142]: Representativeness
          - paragraph [ref=e143]: 用"像不像典型形象"代替"概率有多高"，忽视 基率 与样本量。
          - generic [ref=e144]:
            - generic [ref=e145]: 例
            - text: "\"琳达\"问题：把\"银行出纳 + 女权主义者\"判断为比\"银行出纳\"更可能——合取谬误。"
        - article [ref=e146]:
          - generic [ref=e148]: N° 04
          - heading "损失厌恶 Loss Aversion" [level=3] [ref=e149]:
            - text: 损失厌恶
            - generic [ref=e150]: Loss Aversion
          - paragraph [ref=e151]: 同样大小的 损失 带来的痛苦，约为等量 收益 带来快乐的 2 倍 。参考点在哪儿，决定是"赚"还是"亏"。
          - generic [ref=e152]:
            - generic [ref=e153]: 例
            - text: 已买入的股票跌 10% 比"少赚 10%"更让人难受；导致"不卖就不算亏"式的死扛。
        - article [ref=e154]:
          - generic [ref=e156]: N° 05
          - heading "框架效应 Framing" [level=3] [ref=e157]:
            - text: 框架效应
            - generic [ref=e158]: Framing
          - paragraph [ref=e159]: 同一件事被 怎么描述 ，决定我们如何选择。"存活率 90%" 与 "死亡率 10%" 是同一回事，但反应不同。
          - generic [ref=e160]:
            - generic [ref=e161]: 例
            - text: 医疗方案"术后 90% 存活"会被偏好；同样事实的"10% 死亡率"则被拒绝——尽管数学完全相同。
        - article [ref=e162]:
          - generic [ref=e164]: N° 06
          - heading "禀赋效应 Endowment" [level=3] [ref=e165]:
            - text: 禀赋效应
            - generic [ref=e166]: Endowment
          - paragraph [ref=e167]: 一旦拥有， 估值 就变高。这与"它值多少"无关，与"它是我的"有关。
          - generic [ref=e168]:
            - generic [ref=e169]: 例
            - text: 赠品实验：刚拿到杯子的人，估值中位数 ≈ 7 美元；未拿到的人愿意付 ≈ 3 美元买同样的杯子。
        - article [ref=e170]:
          - generic [ref=e172]: N° 07
          - heading "沉没成本 Sunk Cost" [level=3] [ref=e173]:
            - text: 沉没成本
            - generic [ref=e174]: Sunk Cost
          - paragraph [ref=e175]: 已经付出、 不可回收 的成本，不应再影响未来决策。但人却会为了"不浪费"而继续投入。
          - generic [ref=e176]:
            - generic [ref=e177]: 例
            - text: 一部看到一半却发现很差的电影，理性应离场；但"已经看了 1 小时"让我们坐到底。
        - article [ref=e178]:
          - generic [ref=e180]: N° 08
          - heading "回归均值 Regression to the Mean" [level=3] [ref=e181]:
            - text: 回归均值
            - generic [ref=e182]: Regression to the Mean
          - paragraph [ref=e183]: 极端表现之后， 自然会有 向均值靠拢的回弹。但人习惯把它归因于自己的"干预"或"惩罚"。
          - generic [ref=e184]:
            - generic [ref=e185]: 例
            - text: 骂了表现糟糕的球员，下场他反弹——教练会以为骂有用。真实原因常常是回归，而不是管教。
        - article [ref=e186]:
          - generic [ref=e188]: N° 09
          - heading "过度自信 · 后见之明 Overconfidence / Hindsight" [level=3] [ref=e189]:
            - text: 过度自信 · 后见之明
            - generic [ref=e190]: Overconfidence / Hindsight
          - paragraph [ref=e191]: 事前 我们高估自己的判断； 事后 我们又觉得"早就知道"——这让我们既冒险，又学不到东西。
          - generic [ref=e192]:
            - generic [ref=e193]: 例
            - text: "\"我早就说了会涨\"——这种回忆几乎从不出错；于是错判的原因被悄悄抹平，下次继续重蹈覆辙。"
        - article [ref=e194]:
